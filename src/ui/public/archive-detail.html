<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Night Foundry — archive detail</title>
    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="kanban.css">
  </head>
  <body class="detail-page">
    <header class="app-bar">
      <nav class="page-nav"><a class="nav-link" href="/archives.html">← Archives</a></nav>
      <span id="archive-id" class="page-title-mono numeric"></span>
    </header>
    <section id="conclusion-band" class="conclusion-band">
      <span id="verdict-badge"></span>
      <span id="verdict-tests" class="numeric"></span>
      <span id="verdict-cost" class="numeric"></span>
    </section>
    <div class="section-label">Spec</div>
    <section id="spec-block"><pre></pre></section>
    <div class="section-label">Reviewer findings</div>
    <section id="reviewer-block"></section>
    <div class="section-label">Cost</div>
    <section id="cost-block"></section>
    <div class="section-label">Tasks</div>
    <section id="kanban-root">
      <main id="milestone-columns"></main>
      <aside id="verify-panel" hidden></aside>
      <footer id="progress-bar"><div id="progress-fill"></div><span id="progress-text"></span></footer>
      <div id="cost-display"></div>
    </section>
    <a id="report-button" target="_blank">Open run report</a>
    <script src="kanban.js"></script>
    <script src="archive-detail.js"></script>
  </body>
</html>
